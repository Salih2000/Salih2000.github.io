</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrow-head" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="524" rx="14"/><text x="28" y="44" class="t-title" text-anchor="start">The code stayed; everything around it left, step by step</text><text x="28" y="68" class="t-sub" text-anchor="start">What was withdrawn from the MinIO community edition, and when</text><text x="233" y="114" class="t-head" text-anchor="middle">Source</text><text x="233" y="131" class="t-head" text-anchor="middle">code</text><text x="327" y="114" class="t-head" text-anchor="middle">Admin</text><text x="327" y="131" class="t-head" text-anchor="middle">console</text><text x="421" y="114" class="t-head" text-anchor="middle">New binaries</text><text x="421" y="131" class="t-head" text-anchor="middle">and images</text><text x="515" y="114" class="t-head" text-anchor="middle">Security</text><text x="515" y="131" class="t-head" text-anchor="middle">fixes</text><text x="609" y="114" class="t-head" text-anchor="middle">Pulling old</text><text x="609" y="131" class="t-head" text-anchor="middle">images</text><line class="rule" x1="28" y1="148" x2="652" y2="148"/><text x="28" y="173" class="t-row" text-anchor="start">November 2024</text><text x="28" y="192" class="t-small" text-anchor="start">AIStor announced</text><circle class="dot-on" cx="233" cy="177" r="11"/><circle class="dot-on" cx="327" cy="177" r="11"/><circle class="dot-on" cx="421" cy="177" r="11"/><circle class="dot-on" cx="515" cy="177" r="11"/><circle class="dot-on" cx="609" cy="177" r="11"/><line class="rule" x1="28" y1="206" x2="652" y2="206"/><text x="28" y="231" class="t-row" text-anchor="start">May 2025</text><text x="28" y="250" class="t-small" text-anchor="start">Console reduced</text><circle class="dot-on" cx="233" cy="235" r="11"/><circle class="dot-off" cx="327" cy="235" r="11"/><circle class="dot-on" cx="421" cy="235" r="11"/><circle class="dot-on" cx="515" cy="235" r="11"/><circle class="dot-on" cx="609" cy="235" r="11"/><line class="rule" x1="28" y1="264" x2="652" y2="264"/><text x="28" y="289" class="t-row" text-anchor="start">October 2025</text><text x="28" y="308" class="t-small" text-anchor="start">Source code only</text><circle class="dot-on" cx="233" cy="293" r="11"/><circle class="dot-off" cx="327" cy="293" r="11"/><circle class="dot-off" cx="421" cy="293" r="11"/><circle class="dot-on" cx="515" cy="293" r="11"/><circle class="dot-on" cx="609" cy="293" r="11"/><line class="rule" x1="28" y1="322" x2="652" y2="322"/><text x="28" y="347" class="t-row" text-anchor="start">February 2026</text><text x="28" y="366" class="t-small" text-anchor="start">Repository archived</text><circle class="dot-on" cx="233" cy="351" r="11"/><circle class="dot-off" cx="327" cy="351" r="11"/><circle class="dot-off" cx="421" cy="351" r="11"/><circle class="dot-off" cx="515" cy="351" r="11"/><circle class="dot-on" cx="609" cy="351" r="11"/><line class="rule" x1="28" y1="380" x2="652" y2="380"/><text x="28" y="405" class="t-row" text-anchor="start">September 2026</text><text x="28" y="424" class="t-small" text-anchor="start">Images withdrawn</text><circle class="dot-on" cx="233" cy="409" r="11"/><circle class="dot-off" cx="327" cy="409" r="11"/><circle class="dot-off" cx="421" cy="409" r="11"/><circle class="dot-off" cx="515" cy="409" r="11"/><circle class="dot-off" cx="609" cy="409" r="11"/><line class="rule" x1="28" y1="438" x2="652" y2="438"/><circle class="dot-on" cx="37" cy="467" r="8"/><text x="54" y="472" class="t-small" text-anchor="start">In the community edition</text><circle class="dot-off" cx="349" cy="467" r="8"/><text x="366" y="472" class="t-small" text-anchor="start">No longer there</text><text x="28" y="502" class="t-note" text-anchor="start">The last security fix, in October 2025, was published as source code only.</text></svg>
