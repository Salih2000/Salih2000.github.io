<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 524" width="680" height="524" role="img" aria-labelledby="t d"><title id="t">The code stayed; everything around it left, step by step</title><desc id="d">A grid of five dates and five columns. The source code is there on every date; the admin console goes in May 2025, new binaries and images in October 2025, security fixes in February 2026, and pulling the old images in September 2026.</desc>
